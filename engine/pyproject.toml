[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memeng"
version = "0.0.1"
description = "Fuzzy memory engine v0 — cognitive loop over polytemporal episodes"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Shing Wong" }]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
